services:
  - type: web
    name: mobibit-africa-api
    runtime: python
    rootDir: mobibit-africa-frontend
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        value: mobibit-secret-key-2026
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./mobibit.db
      - key: AT_USERNAME
        value: sandbox
      - key: STRIKE_ENVIRONMENT
        value: sandbox
      - key: MTN_MOMO_ENVIRONMENT
        value: sandbox
